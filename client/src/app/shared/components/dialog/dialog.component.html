<h2 mat-dialog-title>{{data.title}}</h2>
<mat-dialog-content>
  {{data.content}}
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button [mat-dialog-close]="false">{{data.cancelButtonText}}</button>
  <button mat-button [mat-dialog-close]="true" cdkFocusInitial>{{data.confirmButtonText}}</button>
</mat-dialog-actions>
